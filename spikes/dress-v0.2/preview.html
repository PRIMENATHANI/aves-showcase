<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AVES Dress Spike v0.2</title>
<style>
:root{--bg:#07090c;--ink:#f3f5f8;--muted:#9aa3ae;--acc:#19b45a}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif}
.track{height:900vh}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.fig{height:94vh;aspect-ratio:896/1536;position:relative}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s}
.fig img.on{opacity:1}
.shelf{position:absolute;left:max(24px,calc(50% - 27vh - 340px));top:50%;transform:translateY(-50%);list-style:none;margin:0;padding:0;font-size:15px;line-height:2.1}
.shelf li{color:var(--muted);transition:color .2s}
.shelf li.on{color:var(--ink)} .shelf li.now{color:var(--acc);font-weight:700}
.read{position:absolute;right:max(24px,calc(50% - 27vh - 300px));top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);max-width:280px}
.read b{display:block;color:var(--ink);font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
@media (max-width:760px){.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}.shelf,.read{display:none}.fig{height:86vh;justify-self:center}}
</style></head><body>
<div class="track"></div>
<div class="stage">
 <ul class="shelf" id="shelf"></ul>
 <div class="fig" id="fig"></div>
 <div class="read"><b>Oil &amp; Gas</b><span id="now">Scroll to dress him.</span><br><br>Throwaway spike v0.2: head items FLUX.2 klein 9B, body items Qwen Image Edit 2511 Lightning, Draw Things on the Studio; each item box-merged onto the running frame.</div>
</div>
<script>
const L=["Base: coverall and boots", "Head: AVES Titan AV-841R", "Eye: AV-SG30", "Hearing: AV-HM3093 cap earmuffs", "Hi-vis vest (Scuta 3116RR71)", "Fall: AV-831 full-body harness", "Dropped objects: AV-101373 tether", "Respiratory: escape hood pouch", "Hand: HG-2230 rubber gloves"];
const fig=document.getElementById('fig'),shelf=document.getElementById('shelf'),now=document.getElementById('now');
L.forEach((t,i)=>{const im=new Image();im.src='frames/'+String(i).padStart(2,'0')+'.jpg';im.alt=t;fig.appendChild(im);if(i){const li=document.createElement('li');li.textContent=t;shelf.appendChild(li)}});
let cur=-1;function upd(){if(cur===-2)return;const max=document.documentElement.scrollHeight-innerHeight;const i=Math.min(L.length-1,Math.floor(scrollY/max*L.length));if(i===cur)return;cur=i;
[...fig.children].forEach((im,k)=>im.classList.toggle('on',k===i));[...shelf.children].forEach((li,k)=>{li.classList.toggle('on',k+1<i);li.classList.toggle('now',k+1===i)});now.textContent=L[i]}
addEventListener('scroll',upd,{passive:true});const q=new URLSearchParams(location.search).get('f');if(q!==null){cur=-2;const i=+q;[...fig.children].forEach((im,k)=>im.classList.toggle('on',k===i));[...shelf.children].forEach((li,k)=>{li.classList.toggle('on',k+1<i);li.classList.toggle('now',k+1===i)});now.textContent=L[i]}else upd();
</script></body></html>
