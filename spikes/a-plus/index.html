<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVES Experience: A+ spike (Oil &amp; Gas)</title>
<link rel="icon" href="data:,">
<script>
window.__errs = [];
window.addEventListener('error', e => window.__errs.push('error: ' + (e.message || (e.target && (e.target.src || e.target.href)))), true);
window.addEventListener('unhandledrejection', e => window.__errs.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="track" id="track">
  <div class="stage" id="stage">
    <div class="bd" id="bd"><img id="bdA" alt=""><img id="bdB" alt=""></div>
    <div class="haze" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cam" id="cam">
      <div class="cast" id="cast"></div>
      <div class="contact"></div>
      <div class="man" id="man"><img class="base" src="../../assets/dress/base.png" alt="Worker"><div class="lit" id="lit"></div></div>
    </div>
    <div class="grade" aria-hidden="true"></div>

    <header class="hdr"><img class="logo" src="art/aves-logo-rev.png" alt="AVES"><span class="lbl">A+ spike · throwaway</span></header>

    <section class="intro" id="intro">
      <p class="lbl g">Kit 01 / 18 · Energy</p>
      <h1 class="disp" id="kname">Oil &amp; Gas</h1>
      <p class="ki" id="kintro"></p>
      <ul class="hz" id="khz"></ul>
      <p class="cue lbl">Scroll to kit him out</p>
    </section>

    <aside class="rack" id="rack" aria-label="The kit on the shelf">
      <img class="rk" src="art/shelf.jpg" alt="">
      <div class="rk-shade"></div>
      <div class="sign">
        <img src="art/aves-logo.png" alt="AVES">
        <div class="sg-t"><b class="disp" id="rkName">Oil &amp; Gas PPE Kit</b><span>Your Total Safety Solutions Partner</span></div>
        <span class="cnt disp"><i id="cntI">0</i>/ <b id="cntN">8</b></span>
      </div>
      <div class="prog" id="prog"></div>
      <ol class="items" id="items"></ol>
    </aside>

    <div class="capshade" id="capshade"></div>
    <div class="cap" id="cap"></div>
    <div class="fly" id="fly" aria-hidden="true"></div>

    <section class="end" id="end">
      <p class="lbl g">Head to toe. One brand.</p>
      <h2 class="disp" id="endT">The AVES Oil &amp; Gas Kit</h2>
      <ul class="list" id="endL"></ul>
      <div class="acts"><button class="cta" id="quote">Add to quote</button><button class="next" id="next">Next site: Construction</button></div>
    </section>
    <aside class="dw" id="dw" aria-label="Product details" aria-hidden="true" data-lenis-prevent>
      <button class="dw-x lbl" id="dwX">Close</button>
      <div class="dw-b" id="dwB"></div>
    </aside>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="app.js"></script>
</body>
</html>
