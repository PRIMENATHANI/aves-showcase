<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVES Arsenal Wall</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--ink:#f3f5f8;--muted:#9aa3ae;--line:rgba(255,255,255,.12);--green:#00913f;--green-t:#19b45a;--gut:32px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% -8%,rgba(214,226,240,.20),rgba(214,226,240,.07) 45%,transparent 75%),
             linear-gradient(180deg,#141a21 0%,#0b0e12 55%,var(--bg) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.disp{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}

header{position:relative;z-index:3;padding:18px var(--gut) 0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:flex-end;gap:18px}
.brand img{height:30px;width:auto;filter:brightness(0) invert(1);opacity:.95;display:block}
.brand h1{font-family:"Barlow Condensed";font-weight:700;font-size:34px;line-height:.9;text-transform:uppercase;letter-spacing:.01em}
.count{font-family:"Barlow Condensed";font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.count b{color:var(--green-t);font-weight:700}
.hz{display:flex;align-items:center;gap:22px;margin-top:14px;flex-wrap:wrap}
.hz label{position:relative;display:flex;align-items:center;flex:0 1 520px;min-width:0}
.hz input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:500 15px Barlow;padding:7px 2px 7px 26px;outline:none}
.hz input:focus{border-bottom-color:var(--green-t)}
.hz input::placeholder{color:#7d8792}
.hz svg{position:absolute;left:2px;width:15px;height:15px;stroke:var(--muted)}
.chips{display:flex;gap:16px;flex-wrap:wrap}
.chip{font-family:"Barlow Condensed";font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent;transition:color .15s}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink);border-bottom-color:var(--green-t)}
.readout{font:500 14px Barlow;color:var(--muted);min-height:20px;margin-left:auto;white-space:nowrap}
.readout b{color:var(--green-t);font-weight:600}
nav.rails{position:sticky;top:0;z-index:4;display:flex;gap:20px;padding:10px var(--gut) 8px;overflow-x:auto;scrollbar-width:none}
nav.rails::-webkit-scrollbar{display:none}
@media (max-width:759px){nav.rails{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}}
.rail{font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:3px 0;border-bottom:2px solid transparent}
.rail:hover{color:var(--ink)}
.rail.on{color:var(--ink);border-bottom-color:var(--green-t)}
.rail sup{font-size:11px;color:var(--green-t);margin-left:3px;vertical-align:4px}

#stage{position:relative;z-index:1;margin:0 var(--gut);overflow:hidden}
#wall{position:relative;transform-origin:0 0}
.glabel{position:absolute;font-family:"Barlow Condensed";font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;line-height:16px}
.glabel b{color:var(--green-t);font-weight:700;margin-left:6px}
.item{position:absolute;display:block;padding:0;transition:opacity .2s ease}
.item .lit{position:absolute;inset:0}
.item img{position:absolute;display:block;transform-origin:50% 100%;transition:transform .18s cubic-bezier(.2,.7,.3,1);user-select:none;-webkit-user-drag:none}
#wall.hovering .item{opacity:.5}
#wall.hovering .item.hot{opacity:1}
.item.hot img{transform:scale(1.08)}
.item:focus-visible{outline:1px solid var(--green-t);outline-offset:2px}
.item.lifted{visibility:hidden}

/* spotlight */
#spot{position:fixed;inset:0;z-index:20;visibility:hidden}
#spot .scrim{position:absolute;inset:0}
#spot .panel{position:absolute;left:50%;top:50%;width:min(1080px,calc(100vw - 64px));height:min(620px,calc(100vh - 80px));transform:translate(-50%,-50%);display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;pointer-events:none}
#spot .slot{position:relative;height:100%;max-height:520px}
#spot .glow{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(25,180,90,.20) 0%,rgba(200,215,235,.10) 32%,transparent 66%);pointer-events:none}
#spot .info{pointer-events:auto;max-height:100%;overflow:auto;padding-right:6px}
.info .cat{font-family:"Barlow Condensed";font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-t)}
.info h2{font-family:"Barlow Condensed";font-weight:700;font-size:52px;line-height:.95;text-transform:uppercase;margin:8px 0 10px;overflow-wrap:anywhere}
.info .sku{font:500 14px Barlow;color:var(--muted);letter-spacing:.04em}
.info .std{margin-top:14px;font:500 14px Barlow;color:var(--ink);line-height:1.45}
.info .std span{display:block;font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.info ul{list-style:none;margin-top:18px;display:grid;gap:9px}
.info li{font:400 15px/1.45 Barlow;color:#c9d0d8;padding-left:16px;position:relative}
.info li::before{content:"";position:absolute;left:0;top:.68em;width:7px;height:1px;background:var(--green-t)}
.info li strong{color:var(--ink);font-weight:600}
.cta{margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:var(--green);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;border-radius:2px;transition:background .15s,transform .15s}
.cta:hover{background:#00a548}.cta:active{transform:scale(.98)}
.close{position:absolute;top:-8px;right:-12px;width:44px;height:44px;display:grid;place-items:center;pointer-events:auto;z-index:3}
.close:focus{outline:none}.close:focus-visible{outline:1px solid var(--green-t)}
.close svg{width:22px;height:22px;stroke:var(--ink)}
#flyer{position:fixed;z-index:21;left:0;top:0;transform-origin:0 0;pointer-events:none;visibility:hidden;will-change:transform}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;font:500 14px Barlow;background:#151b22;color:var(--ink);padding:11px 18px;border-left:2px solid var(--green-t);opacity:0;pointer-events:none}
html.still *{transition:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:759px){
  :root{--gut:16px}
  header{padding-top:16px}
  .brand{gap:12px}.brand img{height:22px}.brand h1{font-size:26px}
  .count{font-size:15px}
  .hz{gap:10px 16px;margin-top:12px}
  .hz label{flex:1 1 100%}
  .chips{gap:4px 14px}
  .readout{margin-left:0;white-space:normal}
  nav.rails{background:linear-gradient(180deg,rgba(11,14,18,.97) 70%,rgba(11,14,18,0));padding:10px var(--gut) 12px;gap:16px}
  #stage{overflow:visible;padding-bottom:40px}
  #spot .panel{left:0;top:auto;bottom:0;transform:none;width:100%;height:84vh;height:84dvh;display:flex;flex-direction:column;align-items:stretch;gap:0;background:#0e1318;border-top:1px solid var(--line);border-radius:14px 14px 0 0;pointer-events:auto;padding:0 16px}
  #spot .slot{flex:0 0 34%;max-height:none;margin-top:14px}
  #spot .info{flex:1;overflow:auto;padding:6px 0 28px}
  .info h2{font-size:38px}
  .close{top:10px;right:6px}
  .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:8px auto 0;flex:0 0 auto}
}
@media (min-width:760px){.grab{display:none}}
</style>
</head>

<header>
  <div class="top">
    <div class="brand">
      <img src="../../assets/aves-logo.png" alt="AVES Safety" width="116" height="30">
      <h1>Head to toe. One brand.</h1>

  <div class="hz">

      <span class="sr">Filter by hazard</span>

</div>
<img id="flyer" alt="">

const LABEL_H = 20, SHELF_GAP = 14;
function plan(W, H){

      for (let R = 1; R <= 14; R++){
        const ws = groups.slice(a, b).map((g, k) => Math.max(Math.ceil(g.items.length / R) * s, lw[a + k]));
        if (ws.reduce((x, y) => x + y, 0) + minGap * (b - a - 1) <= W) return {R, ws, h: LABEL_H + R * s};
      }
      return null;
    };
    const best = [{h: -SHELF_GAP, cut: []}];
    for (let i = 1; i <= n; i++){
      best[i] = null;
      for (let j = 0; j < i; j++){
        if (!best[j]) continue;
        const sh = shelfFor(j, i); if (!sh) continue;
        const h = best[j].h + SHELF_GAP + sh.h;
        if (!best[i] || h < best[i].h) best[i] = {h, cut: [...best[j].cut, {a: j, b: i, ...sh}]};
      }
    }
    if (best[n] && (best[n].h <= H || s === 24)) return {s, minGap, h: best[n].h, shelves: best[n].cut};
  }
}
function layout(){

  if (phone){
    const cols = 5, s = Math.floor(W / cols);
    let y = 0;
    groups.forEach(g => {
      g.box = {x:0, y, w:W, h:0};
      place(g.label, 0, y); y += LABEL_H + 6;
      g.items.forEach((p, i) => cell(p, (i % cols) * s, y + Math.floor(i / cols) * s, s));
      y += Math.ceil(g.items.length / cols) * s + 28;
      g.box.h = y - g.box.y;

  }
  const H = Math.max(240, innerHeight - stage.getBoundingClientRect().top - 14);

  let y = Math.max(0, Math.floor((H - L.h) / 2));

    const gs = groups.slice(sh.a, sh.b), total = sh.ws.reduce((a, c) => a + c, 0);
    let gap = gs.length > 1 ? Math.min((W - total) / (gs.length - 1), s * 3) : 0;
    gap = Math.max(gap, minGap);

      g.box = {x, y, w: bw, h: LABEL_H + sh.R * s};
      place(g.label, x + s * .08, y);

  const to = fromRect(p), cur = targetRect(p), dur = D(.38);
  gsap.to('#info > *, #close, #glow', {autoAlpha: 0, duration: D(.15), overwrite: true});
  if (mode === 'phone') gsap.to(panel, {yPercent: 100, duration: dur, ease: 'power3.in'});
  gsap.to('#scrim', {opacity: 0, duration: dur});
  gsap.to(wall, {opacity: 1, duration: dur, ease: 'power2.out'});
  gsap.to(flyer, {x: to.left, y: to.top, scale: to.width / cur.w, duration: dur, ease: 'power3.out', onComplete: () => {
    p._el.classList.remove('lifted'); gsap.set(flyer, {autoAlpha: 0}); gsap.set(spot, {autoAlpha: 0});
    lifted = null; lenis && lenis.start(); p._el.focus({preventScroll: true});
  }});
}
function toast(){
  gsap.killTweensOf('#toast');
  gsap.timeline().fromTo('#toast', {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: .22, ease: 'power2.out'})
                 .to('#toast', {autoAlpha: 0, duration: .25, delay: 1.6});
}

// ---------- wiring ----------
let lenis = null;
function wire(){
  if (!RM){
    lenis = new Lenis({lerp: .12});
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }
  wall.addEventListener('pointerover', e => { if (e.pointerType === 'mouse'){ const b = e.target.closest('.item'); if (b) light(byId(b)); } });
  wall.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') light(null); });
  wall.addEventListener('click', e => {
    const b = e.target.closest('.item'); if (!b) return;
    const p = byId(b);
    // touch: first tap lights it, second tap lifts it
    if (lastPointer !== 'mouse' && hot !== p && e.detail !== 0){ light(p); return; }
    open(p);
  });
  wall.addEventListener('focusin', e => { const b = e.target.closest('.item'); if (b && lastPointer === 'kbd') light(byId(b)); });
  addEventListener('pointerdown', e => lastPointer = e.pointerType, true);
  addEventListener('keydown', e => { if (e.key === 'Tab') lastPointer = 'kbd'; if (e.key === 'Escape'){ if (lifted) close(); else if (zoomed) goCat(''); } });
  $('#scrim').addEventListener('click', close);
  $('#close').addEventListener('click', close);
  let tm;
  $('#q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => filter(e.target.value), 120); });
  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const v = activeH === c.dataset.h ? '' : c.dataset.h;
    $('#q').value = v; filter(v);
  });
  $('#rails').addEventListener('click', e => { const r = e.target.closest('.rail'); if (r) goCat(r.dataset.cat === (zoomed && zoomed.cat) ? '' : r.dataset.cat); });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if (lifted) close();
    gsap.set(wall, {x: 0, y: 0, scale: 1}); zoomed = null;
    document.querySelectorAll('.rail').forEach(r => r.classList.toggle('on', !r.dataset.cat));
    layout(); ScrollTrigger.refresh();
  }, 150); });
  // header height changes when web fonts arrive: re-fit the wall to what is left of the viewport
  let lastTop = 0;
  new ResizeObserver(() => {
    const top = Math.round(stage.getBoundingClientRect().top + scrollY);
    if (top === lastTop) return; lastTop = top;
    if (!zoomed && !lifted) layout();
  }).observe(document.querySelector('header'));
}
let lastPointer = 'mouse';
const byId = b => P.find(p => p.id === b.dataset.id);

// ---------- hash states (for review screenshots) ----------
function applyHash(){
  const go = () => {
    if (HASH.get('hazard')){ $('#q').value = HASH.get('hazard'); filter(HASH.get('hazard')); }
    if (HASH.get('cat')) goCat(HASH.get('cat'));
    if (HASH.get('hot')) { const p = P.find(x => x.id === HASH.get('hot')); if (p) light(p); }
    if (HASH.get('lift')){ const p = P.find(x => x.id === HASH.get('lift')); if (p){ const done = () => open(p); p._img.complete ? done() : p._img.addEventListener('load', done, {once:true}); } }
  };
  if (HASH.toString()) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(go));
}
})();
</script>
