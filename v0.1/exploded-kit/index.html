<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVES Exploded Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090c; --ink:#f3f5f8; --muted:#9aa3ae; --line:rgba(255,255,255,.12);
  --green:#00913f; --green-text:#19b45a; --figure:#141922;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto !important}
body{font-family:"Barlow",system-ui,sans-serif;font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.display{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:-.005em;font-weight:700;line-height:.95}

header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px 32px;pointer-events:none}
header img{height:22px;width:auto;filter:brightness(0) invert(1);display:block}
header .kit-name{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--muted)}
header .kit-name b{color:var(--ink);font-weight:600}

.scene{position:relative;height:100vh;width:100%;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 38% 52% at 50% 52%,rgba(120,140,170,.10),rgba(0,0,0,0) 70%);pointer-events:none}
.rig{position:absolute;inset:0;z-index:2;will-change:transform}
.figure-box{position:absolute;z-index:2}
.figure-box svg{width:100%;height:100%;display:block;overflow:visible}
.leaders{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.leaders line{stroke:rgba(255,255,255,.22);stroke-width:1}
.leaders circle{fill:rgba(255,255,255,.5)}
#items,#labels,#leaders{visibility:hidden}
.item{position:absolute;will-change:transform;pointer-events:none}
.item img{width:100%;height:100%;display:block;object-fit:contain}
.item.flip img{transform:scaleX(-1)}
.label{position:absolute;text-align:center;pointer-events:none;z-index:9}
.label .cat{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.label .nm{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin-top:2px}

.counter{position:absolute;left:32px;bottom:28px;z-index:10;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-weight:600;font-size:18px;letter-spacing:.04em;color:var(--muted)}
.counter b{color:var(--green-text);font-weight:700}
.counter .brand{color:var(--ink)}
.counter::before{content:"";display:block;width:28px;height:2px;background:var(--green);margin-bottom:10px}

.final{position:absolute;z-index:12;max-width:440px}
.final h1{font-size:clamp(48px,5.6vw,84px)}
.final p{color:var(--muted);margin-top:16px;font-size:17px}
.final p b{color:var(--ink);font-weight:600}
.btn{appearance:none;border:0;cursor:pointer;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;font-weight:700;letter-spacing:.05em;font-size:17px;background:var(--ink);color:var(--bg);padding:14px 26px;border-radius:2px;margin-top:28px;transition:transform .18s ease,background .18s ease}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--green-text);outline-offset:3px}

.after{height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:15px;border-top:1px solid var(--line)}

/* kit list */
.sheet{position:fixed;z-index:60;top:0;right:0;height:100%;width:400px;max-width:100%;background:#0b0e13;border-left:1px solid var(--line);display:flex;flex-direction:column;visibility:hidden}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 28px 14px}
.sheet-head h2{font-size:30px}
.sheet-head .sub{color:var(--muted);font-size:14px;margin-top:6px}
.close{appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;margin:-4px -6px 0 0}
.close:hover{color:var(--ink)}
.rows{list-style:none;overflow-y:auto;flex:1;padding:0 28px}
.rows li{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rows li img{width:52px;height:44px;object-fit:contain}
.rows .n{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;font-size:17px;line-height:1.05}
.rows .m{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.rows .m .sku{color:var(--ink)}
.rows .m i{font-style:normal;opacity:.75}
.sheet-foot{padding:16px 28px 26px;border-top:1px solid var(--line)}
.sheet-foot .btn{margin-top:0;width:100%}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:2px;pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:799px){
  header{padding:16px}
  header img{height:17px}
  header .kit-name{font-size:12px}
  .counter{left:16px;bottom:18px;font-size:15px}
  .counter::before{width:22px;margin-bottom:7px}
  .label .cat{font-size:9.5px;letter-spacing:.05em}
  .label .nm{font-size:12px}
  .label .role{display:none}
  .final h1{font-size:40px}
  .final p{font-size:15px;margin-top:10px}
  .final .btn{margin-top:16px;font-size:15px;padding:12px 20px}
  .sheet{top:auto;bottom:0;height:auto;max-height:72vh;width:100%;border-left:0;border-top:1px solid var(--line)}
  .sheet-head{padding:20px 16px 10px}
  .sheet-head h2{font-size:24px}
  .rows{padding:0 16px}
  .sheet-foot{padding:12px 16px 18px}
}
</style>
</head>
<body>
<header>
  <img src="../../assets/aves-logo.png" alt="AVES">
  <div class="kit-name">Kit · <b>Oil &amp; Gas · Drilling</b></div>
</header>

<section class="scene" id="scene">
  <div class="glow"></div>
  <svg class="leaders" id="leaders" aria-hidden="true"></svg>
  <div class="rig" id="rig">
  <div class="figure-box" id="figure" aria-hidden="true">
    <svg viewBox="0 0 300 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <g id="body">
          <ellipse cx="150" cy="76" rx="33" ry="41"/>
          <path d="M135 104 L135 148 L165 148 L165 104 Z"/>
          <path d="M150 140 C180 140 205 144 222 152 C238 158 244 172 242 192 L230 262 C222 300 210 330 208 360 C210 380 214 400 212 420 L206 560 C204 600 200 640 198 700 L196 752 C206 760 214 770 212 782 L160 784 L160 752 L158 600 L154 446 C152 436 148 436 146 446 L142 600 L140 752 L140 784 L88 782 C86 770 94 760 104 752 L102 700 C100 640 96 600 94 560 L88 420 C86 400 90 380 92 360 C90 330 78 300 70 262 L58 192 C56 172 62 158 78 152 C95 144 120 140 150 140 Z"/>
          <path d="M64 166 C50 176 44 198 42 228 L31 330 L24 430 C20 452 22 480 31 494 C40 503 52 497 55 480 L57 440 L62 342 L71 250 Z"/>
          <path d="M236 166 C250 176 256 198 258 228 L269 330 L276 430 C280 452 278 480 269 494 C260 503 248 497 245 480 L243 440 L238 342 L229 250 Z"/>
        </g>
      </defs>
      <use href="#body" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2.2" stroke-linejoin="round"/>
      <use href="#body" fill="#141922"/>
    </svg>
  </div>
  <div id="items"></div>
  </div>
  <div id="labels"></div>

  <div class="final" id="final">
    <h1 class="display">Head to toe.<br>One brand.</h1>
    <p id="rangeLine">&nbsp;</p>
    <button class="btn" id="buildBtn" type="button">Build this kit</button>
  </div>
  <div class="counter" id="counter"><b id="cn">0</b> of <span id="ct">9</span><span class="brand" id="cbrand"></span></div>
</section>

<section class="after">always value everybody's safety</section>

<aside class="sheet" id="sheet" aria-label="Kit list" aria-hidden="true">
  <div class="sheet-head">
    <div>
      <h2 class="display">Oil &amp; Gas · Drilling kit</h2>
      <div class="sub" id="sheetSub"></div>
    </div>
    <button class="close" id="closeBtn" type="button" aria-label="Close list">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5 L17 17 M17 5 L5 17"/></svg>
    </button>
  </div>
  <ul class="rows" id="rows" data-lenis-prevent></ul>
  <div class="sheet-foot"><button class="btn" id="addAll" type="button">Add all to quote</button></div>
</aside>
<div class="toast" id="toast" role="status">Added to quote (preview)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
(() => {
gsap.registerPlugin(ScrollTrigger);

// Figure space is the SVG viewBox: 300 x 800 units. Every item lands at (cx, cy) with width w, in those units.
// order = body order, head first. z = stacking on the body. rot = landed rotation.
const KIT = [
  { key:'helmet',  id:'av-717p', img:'img/av-717p-noshadow.png', role:'Hard hat',
    cx:150, cy:44, w:122, z:8, rot:0 },
  { key:'glasses', id:'av-sg50', role:'Glasses',
    cx:150, cy:76, w:80, z:5, rot:0 },
  { key:'muffs',   id:'av-hm3093-cap-earmuffs', role:'Ear muffs',
    cx:150, cy:62, w:104, z:4, rot:0 },
  { key:'resp',    id:'n95-av800-particulate-respirator', role:'Respirator',
    cx:150, cy:104, w:54, z:5, rot:0 },
  { key:'shield',  id:'av-vb65-av-fs13', img:'img/av-vb65-av-fs13-smoked.png', role:'Faceshield + bracket',
    cx:150, cy:98, w:96, z:7, rot:0 },
  { key:'harness', id:'full-body-harness-2', role:'Harness',
    cx:150, cy:306, w:148, z:3, rot:0 },
  { key:'lanyard', id:'single-lanyard', role:'Lanyard',
    cx:200, cy:470, w:160, z:1, rot:10, flip:true },
  { key:'belt',    id:'av-101420', role:'Tool belt',
    cx:150, cy:378, w:136, z:4, rot:0 },
  { key:'gloves',  id:'hg-1104-leather-gloves', role:'Gloves', pair:true,
    cx:36, cy:470, w:44, z:6, rot:184, cx2:264, rot2:176 },
];
const N = KIT.length;
const reveal = () => gsap.set(['#items', '#labels', '#leaders'], { autoAlpha: 1 });
const LAND = 0.9;      // timeline units per landing
const STEP = 1;        // spacing between landings
const TAIL = N * STEP + 0.6;

const hashP = (() => {
  const m = location.hash.match(/[#&](?:p|t)=([0-9.]+)/);
  return m ? Math.min(1, Math.max(0, parseFloat(m[1]))) : null;
})();
const hashList = /[#&]list=1/.test(location.hash);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const rig = $('#rig'), scene = $('#scene'), fig = $('#figure'), itemsBox = $('#items'), labelsBox = $('#labels'), leaders = $('#leaders');
const NS = 'http://www.w3.org/2000/svg';

let products = [];
const dispName = it => { let n = (it.p.name || it.id).replace(/\s+–\s+/g,'-'); if (it.p.sku && /^\d{5,}/.test(it.p.sku) && n.startsWith(it.p.sku + ' ')) n = n.slice(it.p.sku.length + 1); return n; };
const catName = c => (c||'').replace('Fall & Dropped Objects','Fall');
const cutSrc = it => it.img || `../../assets/cut/${it.id}.png`;

// ---- build DOM ----
function build() {
  KIT.forEach((it, i) => {
    it.p = products.find(p => p.id === it.id) || {};
    it.nodes = [];
    const count = it.pair ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const d = document.createElement('div');
      d.className = 'item' + ((it.pair && k === 1) || it.flip ? ' flip' : '');
      d.style.zIndex = it.z === 1 ? 1 : 2 + it.z;
      const im = new Image(); im.alt = ''; im.src = cutSrc(it); im.decoding = 'async';
      d.appendChild(im); itemsBox.appendChild(d); it.nodes.push(d);
    }
    const lb = document.createElement('div'); lb.className = 'label';
    lb.innerHTML = `<span class="cat">${catName(it.p.category)}${catName(it.p.category).toLowerCase().startsWith(it.role.slice(0,5).toLowerCase()) ? '' : `<span class="role"> · ${it.role}</span>`}</span><span class="nm">${dispName(it)}</span>`;
    labelsBox.appendChild(lb); it.label = lb;
    const g = document.createElementNS(NS, 'g');
    const ln = document.createElementNS(NS, 'line'); const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 2.2);
    g.append(ln, c); leaders.appendChild(g); it.leader = g; it.line = ln; it.dot = c;
  });
  // kit list
  $('#rows').innerHTML = KIT.map(it => `<li><img src="${cutSrc(it)}" alt=""><div><div class="n">${dispName(it)}</div>
    <div class="m">${it.role} · SKU <span class="sku">${it.p.sku||'not listed'}</span><br>${it.p.standards ? it.p.standards : '<i>Standards not listed in catalogue data</i>'}</div></div></li>`).join('');
  const cats = new Set(products.map(p => p.category));
  $('#rangeLine').innerHTML = `<b>${products.length} products</b> across <b>${cats.size} categories</b>`;
  $('#sheetSub').textContent = `${N} items · ${new Set(KIT.map(k=>k.p.category)).size} categories · one brand`;
  $('#ct').textContent = N;
}

// ---- layout: compute landed boxes and exploded slots in px ----
function natural(it) { const im = it.nodes[0].firstChild; return im.naturalWidth ? im.naturalHeight / im.naturalWidth : 1; }

function layout() {
  const vw = scene.clientWidth, vh = scene.clientHeight, phone = vw < 800;
  const figH = phone ? Math.min(vh * 0.44, 380) : Math.min(vh * 0.84, 820);
  const u = figH / 800, figW = 300 * u;
  const figX = vw / 2 - figW / 2;
  const figY = phone ? vh * 0.255 : vh * 0.09;
  Object.assign(fig.style, { left: figX + 'px', top: figY + 'px', width: figW + 'px', height: figH + 'px' });

  // exploded slots
  let slots;
  if (phone) {
    const g = 16, top = ['helmet','glasses','muffs','resp','shield'], bot = ['harness','lanyard','belt','gloves'];
    const colW = (vw - 2 * g) / 5, colB = (vw - 2 * g) / 4;
    slots = {};
    top.forEach((k, i) => slots[k] = { x: g + colW * (i + .5), y: vh * 0.135, size: Math.min(54, colW * .78), lw: colW - 4 });
    bot.forEach((k, i) => slots[k] = { x: g + colB * (i + .5), y: vh * 0.775, size: k === 'harness' ? 70 : Math.min(58, colB * .7), lw: colB - 6 });
  } else {
    const cx = vw / 2, off = Math.max(250, Math.min(430, vw * 0.29));
    const L = cx - off, R = cx + off;
    slots = {
      helmet: { x: L, y: vh * .16, size: 116 }, glasses: { x: R, y: vh * .18, size: 120 },
      muffs:  { x: L, y: vh * .335, size: 100 }, resp:    { x: R, y: vh * .38, size: 92 },
      shield: { x: L, y: vh * .51, size: 100 }, harness: { x: R, y: vh * .61, size: 150 },
      lanyard:{ x: R, y: vh * .845, size: 100 }, belt:    { x: L, y: vh * .69, size: 120 },
      gloves: { x: L, y: vh * .865, size: 80 },
    };
    if (vh < 760) Object.values(slots).forEach(s => s.size *= vh / 760);
  }

  KIT.forEach(it => {
    const ar = natural(it), w = it.w * u, h = w * ar;
    const s = slots[it.key];
    const pairGap = it.pair ? (phone ? 4 : 10) : 0;
    const scale = Math.min(1.8, s.size / Math.max(w * (it.pair ? 2 : 1) + 0, h));
    it.nodes.forEach((n, k) => {
      const lcx = figX + (k === 1 ? it.cx2 : it.cx) * u, lcy = figY + it.cy * u;
      Object.assign(n.style, { left: (lcx - w / 2) + 'px', top: (lcy - h / 2) + 'px', width: w + 'px', height: h + 'px' });
      const sx = it.pair ? s.x + (k === 0 ? -1 : 1) * (w * scale / 2 + pairGap / 2) : s.x;
      n._ex = { x: sx - lcx, y: s.y - lcy, scale, rotation: 0 };
      n._land = { rotation: k === 1 ? it.rot2 : it.rot };
    });
    // label under slot
    const half = (h * scale) / 2, halfW = (w * scale * (it.pair ? 2 : 1) + (it.pair ? pairGap : 0)) / 2;
    if (phone) {
      const lw = s.lw;
      Object.assign(it.label.style, { left: (s.x - lw / 2) + 'px', top: (s.y + half + 4) + 'px', width: lw + 'px', textAlign: 'center', transform: 'none' });
    } else {
      // label sits beside the item, on the outer side, vertically centred
      const leftSide = s.x < vw / 2;
      const edge = leftSide ? s.x - halfW - 16 : s.x + halfW + 16;
      const lw = Math.max(96, Math.min(180, leftSide ? edge - 24 : vw - edge - 24));
      Object.assign(it.label.style, { left: (leftSide ? edge - lw : edge) + 'px', top: s.y + 'px', width: lw + 'px',
        textAlign: leftSide ? 'right' : 'left', transform: 'translateY(-50%)' });
    }
    // leader: slot edge -> anchor
    const ax = figX + it.cx * u, ay = figY + it.cy * u;
    const dx = ax - s.x, dy = ay - s.y, len = Math.hypot(dx, dy) || 1;
    if (phone) {
      const sy = dy > 0 ? s.y + half + 4 + it.label.offsetHeight + 4 : s.y - half - 6;
      it.line.setAttribute('x1', s.x); it.line.setAttribute('y1', sy);
    } else {
      const r0 = Math.max(half, (w * scale) / (it.pair ? 1 : 2)) * 0.8 + 6;
      it.line.setAttribute('x1', s.x + dx / len * r0); it.line.setAttribute('y1', s.y + dy / len * r0);
    }
    it.line.setAttribute('x2', ax); it.line.setAttribute('y2', ay);
    it.dot.setAttribute('cx', ax); it.dot.setAttribute('cy', ay);
  });

  // phone: in the last beat the dressed figure grows into the space the exploded rows left
  const rigS = phone ? Math.min(1.32, (vh * 0.64) / figH) : 1;
  const rigTop = phone ? 64 : figY;
  rig._final = { scale: rigS, y: rigTop - figY, transformOrigin: `${vw / 2}px ${figY}px` };
  gsap.set(rig, { transformOrigin: rig._final.transformOrigin });
  // final copy
  const fin = $('#final');
  if (phone) Object.assign(fin.style, { left: '16px', right: '16px', top: (rigTop + figH * rigS + 16) + 'px', maxWidth: 'none', textAlign: 'left' });
  else Object.assign(fin.style, { left: Math.max(48, vw / 2 - Math.max(250, Math.min(430, vw * .29)) - 200) + 'px', right: 'auto', top: (vh * .30) + 'px', maxWidth: Math.min(440, vw / 2 - figW / 2 - 110) + 'px' });
}

// ---- counter ----
let lastN = -1;
function setCount(t) {
  let n = 0; for (let i = 0; i < N; i++) if (t >= i * STEP + LAND - 0.02) n++;
  if (n === lastN) return; lastN = n;
  $('#cn').textContent = n;
  $('#cbrand').textContent = n === N ? ' · one brand' : '';
}

// ---- list sheet ----
const sheet = $('#sheet');
let sheetOpen = false;
function openSheet(instant) {
  sheetOpen = true; sheet.setAttribute('aria-hidden', 'false');
  const phone = innerWidth < 800;
  gsap.fromTo(sheet, { autoAlpha: 1, x: phone ? 0 : 40, y: phone ? 40 : 0, opacity: instant ? 1 : 0 },
    { x: 0, y: 0, opacity: 1, duration: instant || reduced ? 0 : .32, ease: 'power2.out' });
}
function closeSheet() {
  sheetOpen = false; sheet.setAttribute('aria-hidden', 'true');
  const phone = innerWidth < 800;
  gsap.to(sheet, { x: phone ? 0 : 40, y: phone ? 40 : 0, autoAlpha: 0, duration: reduced ? 0 : .22, ease: 'power2.in' });
}
$('#buildBtn').addEventListener('click', () => openSheet());
$('#closeBtn').addEventListener('click', closeSheet);
addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
let toastT;
$('#addAll').addEventListener('click', () => {
  const t = $('#toast'); t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
});

// ---- motion ----
function allNodes() { return KIT.flatMap(it => it.nodes); }

function setFinalState() {
  allNodes().forEach(n => gsap.set(n, { x: 0, y: 0, scale: 1, rotation: n._land.rotation }));
  KIT.forEach(it => gsap.set([it.label, it.leader], { autoAlpha: 0 }));
  gsap.set('#final', { autoAlpha: 1, y: 0 });
  gsap.set(rig, { scale: rig._final.scale, y: rig._final.y });
  setCount(99);
}

function buildTimeline() {
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power2.inOut' } });
  KIT.forEach((it, i) => {
    const t0 = i * STEP;
    tl.fromTo([it.label, it.leader], { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.35, ease: 'power1.out' }, t0);
    it.nodes.forEach(n => {
      tl.fromTo(n, { x: () => n._ex.x, y: () => n._ex.y, scale: () => n._ex.scale, rotation: 0 },
                   { x: 0, y: 0, scale: 1, rotation: () => n._land.rotation, duration: LAND }, t0 + 0.04);
    });
  });
  tl.fromTo(rig, { scale: 1, y: 0 }, { scale: () => rig._final.scale, y: () => rig._final.y, duration: 0.6, ease: 'power2.inOut' }, N * STEP - 0.25);
  tl.fromTo('#final', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power2.out' }, N * STEP - 0.05);
  tl.to({}, { duration: TAIL - tl.duration() > 0 ? TAIL - tl.duration() : 0.1 });
  return tl;
}

async function start() {
  try {
    const r = await fetch('../../data/products.json'); products = await r.json();
  } catch (e) { console.error('products.json failed', e); }
  build();
  await Promise.all(allNodes().map(n => n.firstChild.decode().catch(() => {})));
  try { await document.fonts.ready; } catch (e) {}
  layout();
  gsap.set(sheet, { autoAlpha: 0 });

  if (reduced) {
    setFinalState();
    reveal();
    openSheet(true);
    addEventListener('resize', () => { layout(); setFinalState(); });
    return;
  }

  {
    if (hashP === null) {
    const lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }}

  const tl = buildTimeline();
  tl.eventCallback('onUpdate', () => setCount(tl.time()));

  if (hashP !== null) {
    // Screenshot / review mode: jump the scrub position directly, no scrolling.
    addEventListener('resize', () => { layout(); tl.invalidate(); tl.progress(hashP); });
    tl.progress(hashP);
    setCount(tl.time());
    reveal();
    if (hashList) openSheet(true);
    return;
  }

  ScrollTrigger.create({
    trigger: scene, start: 'top top', end: '+=200%',
    pin: true, anticipatePin: 1, scrub: 1,
    animation: tl, invalidateOnRefresh: true,
  });
  ScrollTrigger.addEventListener('refreshInit', layout);
  ScrollTrigger.refresh();
  setCount(tl.time());
  reveal();
  // debug: #s=0.5 scrolls the real page (Lenis + pin) to that share of the scene, to test the scroll path
  const sm = location.hash.match(/[#&]s=([0-9.]+)/);
  if (sm) { const st = ScrollTrigger.getAll()[0]; window.scrollTo(0, st.start + parseFloat(sm[1]) * (st.end - st.start));
    setTimeout(() => { document.body.dataset.dbg = `scrollY=${Math.round(scrollY)} stProg=${st.progress.toFixed(3)} tl=${tl.progress().toFixed(3)} count=${$("#counter").textContent} start=${st.start} end=${st.end} max=${ScrollTrigger.maxScroll(window)} ih=${innerHeight} sceneTop=${Math.round(scene.getBoundingClientRect().top)} lenis=${document.documentElement.className}`; }, 3000); }
}
start();
})();
</script>
