<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AVES Experience: Oil &amp; Gas</title>
<link rel="icon" href="data:,">
<script>
window.__errs = [];
window.addEventListener('error', e => window.__errs.push('error: ' + (e.message || (e.target && (e.target.src || e.target.href)))), true);
window.addEventListener('unhandledrejection', e => window.__errs.push('rejection: ' + (e.reason && e.reason.message || e.reason)));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="track" id="track">
  <div class="stage" id="stage">
    <div class="bd" id="bd"><img id="bdA" alt=""></div>
    <div class="cam" id="cam">
      <div class="cast" id="cast"></div><div class="contact"></div>
      <div class="man" id="man"><img class="base" src="assets/base.png" alt="Worker"></div>
    </div>
    <div class="grade" aria-hidden="true"></div>
    <div class="vmark" id="vmark" aria-hidden="true"></div>

    <header class="hdr"><img class="logo" src="assets/brand/aves-logo-rev.png" alt="AVES"></header>

    <section class="intro" id="intro">
      <p class="kicker"><img src="assets/brand/oil-gas.svg" alt=""><span class="eyebrow" id="kick"></span></p>
      <h1 id="kname"></h1>
      <p class="ki" id="kintro"></p>
      <ul class="hz" id="khz"></ul>
      <p class="cue eyebrow">Scroll to kit him out</p>
    </section>

    <div class="bands" id="bands"></div>
    <div class="co" id="co"></div>
    <div class="capshade" id="capshade"></div>
    <div class="cap" id="cap"></div>

    <aside class="rack" id="rack" aria-label="The kit on the shelf">
      <img class="rk" id="rk" alt="">
      <div class="rk-shade"></div>
      <ol class="items" id="items"></ol>
      <div class="rk-dim" id="rkdim"></div>
      <div class="cards" id="cards"></div>
      <div class="sign">
        <span class="sg-cab"></span><span class="sg-cab r"></span>
        <div class="sg-logo"><img src="assets/brand/aves-logo.png" alt="AVES"></div>
        <div class="sg-t"><span id="signT"></span><span class="tagline">Your Total Safety Solutions Partner</span></div>
        <img class="sg-ic" src="assets/brand/oil-gas.svg" alt="">
      </div>
      <p class="issued"><b><i id="cntI">0</i> / <span id="cntN">8</span></b> issued from stock</p>
      <div class="prog" id="prog"></div>
    </aside>

    <div class="fly" id="fly" aria-hidden="true"></div>

    <section class="end" id="end">
      <p class="eyebrow g">Head to toe. One brand.</p>
      <h2 id="endT"></h2>
      <ul class="list" id="endL"></ul>
      <p class="boots" id="boots"></p>
      <div class="acts"><button class="btn big" id="quote">Add to quote</button></div>
      <img class="tagl" src="assets/brand/tagline-rev.png" alt="Always Value Everybody's Safety">
    </section>

    <section class="pd" id="pd" aria-label="Product details" aria-hidden="true" data-lenis-prevent>
      <button class="pd-x" id="pdX" data-close><span class="eyebrow">Back to the kit</span><i></i></button>
      <div class="pd-b" id="pdB"></div>
    </section>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="app.js"></script>
</body>
</html>
