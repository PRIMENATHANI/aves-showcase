<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AVES Arsenal Wall</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090c;--ink:#f3f5f8;--muted:#9aa3ae;--line:rgba(255,255,255,.12);--accent:#008048;--green-t:#19b45a;--gut:32px;--side:236px;--colgap:28px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 50% at 42% -10%,rgba(214,226,240,.16),rgba(214,226,240,.05) 45%,transparent 75%),
             linear-gradient(180deg,#11161c 0%,#0a0d11 50%,var(--bg) 100%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus{outline:none}
:focus-visible{outline:1px solid var(--green-t);outline-offset:3px}

.page{position:relative;z-index:1;display:grid;grid-template-rows:auto 1fr;align-items:start;grid-template-columns:minmax(0,1fr) var(--side);column-gap:var(--colgap);padding:0 var(--gut)}
.top{grid-column:1;padding:18px 0 12px}
.top img{display:block;height:20px;width:auto;filter:brightness(0) invert(1);opacity:.95}
.top h1{font-family:"Barlow Condensed";font-weight:700;font-size:38px;line-height:.92;text-transform:uppercase;letter-spacing:.005em;margin-top:9px}
.count{margin-top:7px;font-family:"Barlow Condensed";font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.count b{color:var(--green-t);font-weight:700;font-variant-numeric:tabular-nums}
#stage{grid-column:1;position:relative;padding-bottom:8px}
#wall{position:relative}

/* right margin: hazard filter + readout */
#side{grid-column:2;grid-row:1 / span 2;position:sticky;top:0;align-self:start;height:100vh;padding:28px 0 24px;display:flex;flex-direction:column;min-height:0}
.q{position:relative;display:flex;align-items:center}
.q input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:500 15px Barlow;padding:7px 2px 7px 25px;border-radius:0}
.q input:focus{border-bottom-color:var(--green-t);outline:none}
.q input::placeholder{color:#7d8792}
.q svg{position:absolute;left:2px;width:15px;height:15px;stroke:var(--muted)}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:1px;margin-top:12px}
.chip{font-family:"Barlow Condensed";font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 0 3px 12px;position:relative;white-space:nowrap;transition:color .15s}
.chip::before{content:"";position:absolute;left:0;top:50%;width:5px;height:1px;background:var(--line);transition:background .15s,width .15s}
.chip b{font-weight:600;color:#c2c9d1}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink)}.chip.on::before{background:var(--green-t);width:7px}
.chip.on b{color:var(--green-t)}
#hzr{min-height:20px;margin-top:8px;font:500 13.5px/1.4 Barlow;color:var(--muted)}
#hzr b{color:var(--green-t);font-weight:600}
#read{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
#read .cat{font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-t)}
#read h2{font-family:"Barlow Condensed";font-weight:700;font-size:30px;line-height:.98;text-transform:uppercase;margin:6px 0 8px;overflow-wrap:anywhere}
#read .sku{font:500 14px Barlow;color:var(--ink);letter-spacing:.03em}
#read .std{margin-top:12px;font:500 13.5px/1.45 Barlow;color:#c9d0d8}
#read .std span,#read .k{display:block;font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
#read .hint{font:400 13.5px/1.5 Barlow;color:var(--muted)}
#read .hint em{font-style:normal;color:var(--ink)}

/* rail labels (left margin) */
.rl{position:absolute;left:0;display:block;padding:0;width:var(--lw);transition:color .15s}
.rl .n{display:block;font-family:"Barlow Condensed";font-weight:700;font-size:16px;line-height:1.05;white-space:nowrap;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.rl .n i{font-style:normal;font-weight:600;font-size:13px;color:var(--muted);margin-right:7px;letter-spacing:0}
.rl .n b{color:var(--green-t);margin-left:5px}
.rl .d{display:block;margin-top:2px;font:400 12px/1.3 Barlow;color:var(--muted)}
.rl:hover .n{color:#fff}.rl:hover .n i{color:var(--green-t)}
.rl .x{color:#5d6670}
.rule{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.04))}

/* cells */
.item{position:absolute;display:block;padding:0;transform-origin:0 0}
.item .lit,.item .mag{position:absolute;inset:0;display:block}
.item .mag{transform-origin:50% 62%}
.item .back{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .4s;
  background:radial-gradient(closest-side,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 60%)}
#wall:not(.focus) .item.dark .back{opacity:1}
.item img{position:absolute;display:block;object-fit:contain;object-position:50% 100%;user-select:none;-webkit-user-drag:none}
.item.hot{z-index:3}.item.nb{z-index:2}
.item:focus-visible{outline:1px solid var(--green-t);outline-offset:-1px;z-index:4}
.item.lifted .lit{visibility:hidden}

/* focus mode: strip + title + caption */
.sl{position:absolute;font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;line-height:14px;padding:0}
.sl b{color:var(--green-t);margin-left:4px;font-weight:600}
.sl:hover{color:var(--ink)}
#back{position:absolute;left:0;display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
#back svg{width:16px;height:16px;stroke:var(--green-t);flex:0 0 auto}
#back:hover{color:#fff}
#ftitle{position:absolute;left:0;pointer-events:none;white-space:nowrap}
#ftitle .n{font-family:"Barlow Condensed";font-weight:700;font-size:36px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
#ftitle .n b{color:var(--green-t);margin-left:10px}
#ftitle .d{margin-top:5px;font:400 14px Barlow;color:var(--muted)}
#cap{position:absolute;z-index:5;pointer-events:none;text-align:center;font:500 13px/1.3 Barlow;color:var(--ink);opacity:0;text-shadow:0 1px 2px #07090c,0 0 10px #07090c,0 0 18px rgba(7,9,12,.9)}
#cap b{display:block;font-family:"Barlow Condensed";font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
#cap span{color:var(--muted)}
.fonly,.sonly{visibility:hidden;opacity:0}

/* spotlight */
#spot{position:fixed;inset:0;z-index:20;visibility:hidden}
#spot .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,12,.55),rgba(7,9,12,.78) 55%,rgba(7,9,12,.88))}
#spot .panel{position:absolute;left:50%;top:50%;width:min(1100px,calc(100vw - 64px));height:min(640px,calc(100vh - 72px));transform:translate(-50%,-50%);display:grid;grid-template-columns:1.1fr 1fr;gap:52px;align-items:center;pointer-events:none}
#spot .slot{position:relative;height:100%;max-height:540px}
#spot .glow{position:absolute;left:50%;top:50%;width:118%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(0,128,72,.26) 0%,rgba(200,215,235,.09) 34%,transparent 66%);pointer-events:none}
#spot .info{pointer-events:auto;max-height:100%;overflow:auto;padding-right:6px}
.info .cat{font-family:"Barlow Condensed";font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--green-t)}
.info h2{font-family:"Barlow Condensed";font-weight:700;font-size:52px;line-height:.95;text-transform:uppercase;margin:8px 0 10px;overflow-wrap:anywhere}
.info .sku{font:500 14px Barlow;color:var(--muted);letter-spacing:.04em}
.info dl{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font:500 14px/1.45 Barlow}
.info dt{font-family:"Barlow Condensed";font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.info dd{color:var(--ink)}
.info ul{list-style:none;margin-top:18px;display:grid;gap:9px}
.info li{font:400 15px/1.45 Barlow;color:#c9d0d8;padding-left:16px;position:relative}
.info li::before{content:"";position:absolute;left:0;top:.68em;width:7px;height:1px;background:var(--green-t)}
.info li strong{color:var(--ink);font-weight:600}
.acts{margin-top:26px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;background:var(--accent);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;padding:12px 22px;border-radius:2px;transition:background .15s,transform .15s}
.cta:hover{background:#009454}.cta:active{transform:scale(.98)}
.ext{display:inline-flex;align-items:center;gap:7px;font:500 14px Barlow;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.ext:hover{border-bottom-color:var(--green-t)}
.ext svg{width:12px;height:12px;stroke:currentColor}
.step{margin-top:20px;font:400 12.5px Barlow;color:#6f7984}
.close{position:absolute;top:-8px;right:-12px;width:44px;height:44px;display:grid;place-items:center;pointer-events:auto;z-index:3}
.close svg{width:22px;height:22px;stroke:var(--ink)}
#flyer{position:fixed;z-index:21;left:0;top:0;transform-origin:0 0;pointer-events:none;visibility:hidden;will-change:transform}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;font:500 14px Barlow;background:#151b22;color:var(--ink);padding:11px 18px;border-left:2px solid var(--green-t);opacity:0;pointer-events:none}
html.still *{transition:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grab{display:none}

/* phone */
.prail{display:none}
@media (max-width:759px){
  :root{--gut:16px}
  .page{display:flex;flex-direction:column}
  .top{order:1}#side{order:2}#stage{order:3}
  .rl .n i{display:none}
  .top{padding:20px 0 14px}
  #stage{padding-bottom:40px}
  .top img{height:20px}
  .top h1{font-size:34px;margin-top:10px}
  .count{font-size:14px;white-space:normal}
  #side{position:static;height:auto;padding:0 0 6px;display:block;width:100%;min-width:0;max-width:calc(100vw - 32px)}
  .chips{flex-direction:row;overflow-x:auto;width:100vw;gap:18px;margin:8px calc(var(--gut) * -1) 0;padding:0 var(--gut);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding-left:0}.chip::before{display:none}
  .chip.on{box-shadow:inset 0 -2px 0 var(--green-t)}
  #read{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;padding:14px var(--gut) calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(10,13,17,.96);flex:none;overflow:visible;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.7,.3,1)}
  #read.on{transform:none}
  #read h2{font-size:24px;margin:3px 0 4px}
  #read .std{margin-top:6px}
  #read .hint{display:none}
  #wall{height:auto!important}
  #hzr{min-height:0;margin-top:6px}
  .prail{display:block;position:relative;margin-top:22px}
  .prail:first-child{margin-top:4px}
  .prail .rl{position:relative;width:auto}
  .prail .rl .d{display:inline;margin:0 0 0 8px}
  .prail .rl .n{display:inline}
  .rs{position:relative;height:80px;margin:10px calc(var(--gut) * -1) 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rs::-webkit-scrollbar{display:none}
  .rs .pad{height:1px}
  #spot .scrim{background:rgba(4,6,8,.6)}
  #spot .panel{left:0;top:auto;bottom:0;transform:none;width:100%;height:86vh;height:86dvh;display:flex;flex-direction:column;align-items:stretch;gap:0;background:#0e1318;border-top:1px solid var(--line);border-radius:14px 14px 0 0;pointer-events:auto;padding:0 16px}
  #spot .slot{flex:0 0 32%;max-height:none;margin-top:14px}
  #spot .info{flex:1;overflow:auto;padding:6px 0 28px}
  .info h2{font-size:36px}
  .close{top:10px;right:6px}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:8px auto 0;flex:0 0 auto}
  .step{display:none}
}
@media (min-width:760px) and (max-width:1279px){:root{--side:204px;--gut:24px;--colgap:22px}.top h1{font-size:34px}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <img src="../../assets/aves-logo.png" alt="AVES Safety" width="93" height="24">
    <h1>The safety arsenal.</h1>
    <p class="count" id="count" aria-live="off"><b id="nP">0</b> products · <b id="nL">0</b> lines of defence · <b>1</b> brand</p>
  </header>
  <main id="stage" aria-label="Product wall"><div id="wall"></div></main>
  <aside id="side" aria-label="Hazard filter and product readout">
    <label class="q">
      <svg viewBox="0 0 16 16" fill="none" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
      <span class="sr">Filter the wall by hazard</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Type a hazard">
    </label>
    <div class="chips" id="chips"></div>
    <p id="hzr" aria-live="polite"></p>
    <div id="read" aria-live="polite"></div>
  </aside>
</div>

<div id="spot" role="dialog" aria-modal="true" aria-label="Product spotlight">
  <div class="scrim" id="scrim"></div>
  <div class="panel" id="panel" data-lenis-prevent>
    <div class="grab"></div>
    <div class="slot" id="slot"><div class="glow" id="glow"></div></div>
    <div class="info" id="info"></div>
    <button class="close" id="close" aria-label="Close spotlight"><svg viewBox="0 0 22 22" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l14 14M18 4L4 18"/></svg></button>
  </div>
</div>
<img id="flyer" alt="">
<div class="toast" id="toast" role="status">Added to quote (preview)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
(() => {
gsap.registerPlugin(ScrollTrigger);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const INSTANT = RM || location.hash.length > 1;      // any review state skips the entrance
let animOn = !INSTANT;                                 // load-time review states land instantly; later interactions animate unless reduced motion
const D = s => animOn ? s : 0;
if (INSTANT) document.documentElement.classList.add('still');

// body order, head to toe; Eyewash & Showers is filtered out of this wall
const ORDER = ['Head','Eye','Face','Hearing','Respiratory','Hand','Fall & Dropped Objects','Cryogenic'];
const DEF = {   // trimmed from the catalogue section intros
  'Head':'impact, penetration, electrical',
  'Eye':'flying debris, UV, splash',
  'Face':'sparks, molten metal, arc, splash',
  'Hearing':'noise above 85 dB',
  'Respiratory':'dust, fumes, vapours',
  'Hand':'cut, abrasion, chemical, heat, voltage',
  'Fall & Dropped Objects':'height, dropped tools',
  'Cryogenic':'liquefied gas, extreme cold'};
const HAZ = {
  'arc flash': p => /\barc\b|\barc[- ]|nfpa\s*70e/.test(p._t),
  'cut':       p => /en\s*388|\bcut|kevlar/.test(p._t),
  'dust':      p => p.category==='Respiratory' || /\bffp|n95/.test(p._t),
  'height':    p => p.category==='Fall & Dropped Objects',
  'cold':      p => p.category==='Cryogenic',
  'noise':     p => p.category==='Hearing' || /en\s*352/.test(p._t),
  'chemical':  p => /chemical|en\s*374/.test(p._t),
  'impact':    p => p.category==='Head' || /en\s*397|en\s*166|z87/.test(p._t),
};
const SHORT = c => c === 'Fall & Dropped Objects' ? 'Fall & Dropped' : c;
const ALIAS = {arc:'arc flash',flash:'arc flash',electrical:'arc flash',cuts:'cut',laceration:'cut',blade:'cut',
  respiratory:'dust',particulate:'dust',particles:'dust',fumes:'dust',fall:'height',falls:'height',heights:'height',
  cryogenic:'cold',freezing:'cold',hearing:'noise',loud:'noise',chemicals:'chemical',splash:'chemical',acid:'chemical',
  head:'impact',bump:'impact',debris:'impact'};

const $ = s => document.querySelector(s);
const wall = $('#wall'), stage = $('#stage'), read = $('#read');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P = [], groups = [], mode = '', focused = null, lifted = null, hot = null, activeH = '', lenis = null, tl = null;
let cellPx = 0, focusPx = 0, lastPointer = 'mouse';
const LUM = new Map();

// ---------- data ----------
fetch('../../data/products.json').then(r => r.json()).then(data => {
  P = data.filter(p => p.category !== 'Eyewash & Showers').map(p => ({...p,
    _t: [p.category,p.sub,p.name,p.sku,p.standards,(p.bullets||[]).join(' ')].join(' ').toLowerCase()}));
  groups = ORDER.map((c, gi) => ({cat:c, key:String(gi + 1), items:P.filter(p => p.category === c)
    .sort((a,b) => a.name.localeCompare(b.name,'en',{numeric:true}))})).filter(g => g.items.length);
  groups.forEach(g => g.items.forEach((p, i) => { p._g = g; p._i = i; }));
  build();
  // wait for the web fonts (labels measure with them), but never longer than 700 ms
  const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 700))]).then(() => {
    layout(); wire(); entrance(); applyHash(); animOn = !RM; lumPass();
    fonts.then(() => { if (!lifted) layout(); });
  });
});

// ---------- build DOM ----------
function build(){
  const frag = document.createDocumentFragment();
  groups.forEach((g, gi) => {
    g.rule = document.createElement('div'); g.rule.className = 'rule'; frag.appendChild(g.rule);
    g.label = document.createElement('button');
    g.label.className = 'rl'; g.label.dataset.cat = g.cat;
    g.label.setAttribute('aria-label', `${g.cat}, ${g.items.length} products. Key ${g.key} focuses this line.`);
    g.label.innerHTML = `<span class="n"><i>${g.key}</i>${esc(SHORT(g.cat))}<b>${g.items.length}</b></span><span class="d">${esc(DEF[g.cat]||'')}</span>`;
    frag.appendChild(g.label);
    g.slabel = document.createElement('button');
    g.slabel.className = 'sl fonly'; g.slabel.dataset.cat = g.cat; g.slabel.tabIndex = -1;
    g.slabel.innerHTML = `${esc(SHORT(g.cat))}<b>${g.items.length}</b>`;
    frag.appendChild(g.slabel);
    g.items.forEach(p => {
      const b = document.createElement('button');
      b.className = 'item'; b.dataset.id = p.id;
      b.setAttribute('aria-label', `${p.name}, SKU ${p.sku || p.name}, ${p.category}`);
      b.innerHTML = '<span class="lit"><span class="mag"><span class="back"></span></span></span>';
      const im = new Image();
      im.alt = ''; im.decoding = 'async';
      if (gi < 3) im.fetchPriority = 'high';
      im.src = `../../assets/cut/${p.id}.png`;
      im.addEventListener('load', refreshSoon, {once:true});
      b.querySelector('.mag').appendChild(im);
      frag.appendChild(b);
      p._el = b; p._lit = b.firstChild; p._mag = b.firstChild.firstChild; p._img = im;
    });
    // phone rail container (used under 760 px)
    g.prail = document.createElement('section'); g.prail.className = 'prail';
    g.rs = document.createElement('div'); g.rs.className = 'rs'; g.rs.setAttribute('data-lenis-prevent-wheel','');
    g.pad = document.createElement('div'); g.pad.className = 'pad'; g.rs.appendChild(g.pad);
    g.prail.appendChild(g.rs);
  });
  const back = document.createElement('button');
  back.id = 'back'; back.className = 'fonly'; back.tabIndex = -1;
  back.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="1.5" width="5" height="5"/><rect x="1.5" y="9.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/></svg>All 8 lines';
  frag.appendChild(back);
  const ft = document.createElement('div'); ft.id = 'ftitle'; ft.className = 'fonly'; frag.appendChild(ft);
  const cap = document.createElement('div'); cap.id = 'cap'; frag.appendChild(cap);
  wall.appendChild(frag);
  // hazard chips with runtime counts
  $('#chips').innerHTML = Object.keys(HAZ).map(h => {
    const n = P.filter(HAZ[h]).length;
    return `<button class="chip" data-h="${h}" aria-label="${h}, ${n} products">${h} · <b>${n}</b> products</button>`;
  }).join('');
  idleRead();
}
let rt0;

// ---------- layout ----------
function cell(p, x, y, s, inner){

  p._el.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px`;
  Object.assign(p._img.style, {left: pad + 'px', top: pad + 'px', width: box + 'px', height: box + 'px'});
}
function pos(el, x, y){ el.style.left = x + 'px'; el.style.top = y + 'px'; }
function show(els, on){ els.forEach(el => { el.style.visibility = on ? 'visible' : 'hidden'; el.style.opacity = on ? 1 : 0; }); }

function layout(){

function remount(phone){

    groups.forEach(g => { wall.appendChild(g.label); g.items.forEach(p => wall.appendChild(p._el)); g.prail.remove(); });

}
function phoneLayout(){
  const s = 72;
  groups.forEach(g => {
    g.items.forEach((p, i) => { cell(p, 16 + i * s, 4, s); p._row = 0; });
    g.pad.style.width = (32 + g.items.length * s) + 'px';
    g.label.style.cssText = ''; g.rule.style.display = 'none';
  });
  wall.style.height = '';
  cellPx = s;
}
function overviewLayout(){
  wall.classList.remove('focus');
  const W = stage.clientWidth, vw = innerWidth;
  const LW = vw >= 1280 ? 150 : 132, G = 14, X0 = LW + G, WW = W - X0, RG = 12;
  wall.style.setProperty('--lw', LW + 'px');
  groups.forEach(g => g.label.style.width = LW + 'px');
  const lh = groups.map(g => g.label.offsetHeight);
  const top = stage.getBoundingClientRect().top + scrollY;
  const colsFor = s => Math.max(1, Math.floor(WW / s));
  const heightFor = s => {
    const cols = colsFor(s);
    return groups.reduce((h, g, i) => h + Math.max(Math.ceil(g.items.length / cols) * s, lh[i]), 0) + RG * (groups.length - 1);
  };
  const fit = k => { const budget = innerHeight * k - top - 10; let s = 140; while (s > 24 && heightFor(s) > budget) s--; return s; };

  let s = fit(1);
  if (vw >= 1024 && s < 40) s = vw < 1280 ? Math.max(40, fit(1.2)) : 40;
  if (vw < 1024 && s < 40) s = fit(1.2);
  cellPx = s;
  const cols = colsFor(s);
  let y = 0;
  groups.forEach((g, gi) => {
    const rows = Math.ceil(g.items.length / cols), h = Math.max(rows * s, lh[gi]);
    pos(g.label, 0, y + Math.max(0, Math.round(Math.min(s * .1, (rows * s - lh[gi]) / 2))));
    g.rule.style.display = gi ? '' : 'none';
    pos(g.rule, 0, y - RG / 2); g.rule.style.width = '';
    g.items.forEach((p, i) => { cell(p, X0 + (i % cols) * s, y + Math.floor(i / cols) * s, s); p._row = Math.floor(i / cols); });
    g._y = y; g._h = h;
    y += h + RG;
  });
  wall.style.height = (y - RG) + 'px';
  show(groups.map(g => g.label).concat(groups.map(g => g.rule)), true);
  show([...groups.map(g => g.slabel), $('#back'), $('#ftitle')], false);
  groups.forEach(g => { g.label.tabIndex = 0; g.slabel.tabIndex = -1; }); $('#back').tabIndex = -1;
}
function focusLayout(fg){
  wall.classList.add('focus');

  // strip of the other seven rails across the top
  const others = groups.filter(g => g !== fg), BW = 118, SG = 16, LH = 18;
  const avail = W - BW - SG * (others.length);
  let best = null;
  for (let R = 1; R <= 6; R++){
    const colsSum = others.reduce((a, g) => a + Math.ceil(g.items.length / R), 0);
    const ss = Math.min(Math.floor(avail / colsSum), Math.floor(72 / R), 22);
    if (!best || ss > best.ss) best = {R, ss};
  }
  const {R, ss} = best;
  pos($('#back'), 0, LH - 2);
  let x = BW + SG;
  others.forEach(g => {
    const cols = Math.ceil(g.items.length / R);
    pos(g.slabel, x, 0);
    g.items.forEach((p, i) => { cell(p, x + (i % cols) * ss, LH + Math.floor(i / cols) * ss, ss, .04); p._row = Math.floor(i / cols); });
    x += cols * ss + SG;
  });
  const stripH = LH + R * ss;

  const ft = $('#ftitle');
  ft.innerHTML = `<div class="n">${esc(fg.cat)}<b>${fg.items.length}</b></div><div class="d">${esc(DEF[fg.cat]||'')} · key ${fg.key} · Esc returns to all 8 lines</div>`;
  const ty = stripH + 30;
  pos(ft, 0, ty);
  // packed: 128-144 px cells, 10 px gap, as many per row as fit; the caption floats over the next row
  const y0 = ty + 70, GAP = 10, n = fg.items.length;

  const s = Math.min(144, Math.floor((W - GAP * (cols - 1)) / cols));
  focusPx = s;
  fg.items.forEach((p, i) => { cell(p, (i % cols) * (s + GAP), y0 + Math.floor(i / cols) * (s + GAP), s, .06); p._row = Math.floor(i / cols); });
  wall.style.height = (y0 + Math.ceil(n / cols) * (s + GAP) + 40) + 'px';
  show(groups.map(g => g.label).concat(groups.map(g => g.rule)), false);
  show([...others.map(g => g.slabel), $('#back'), ft], true);
  show([fg.slabel], false);
  groups.forEach(g => { g.label.tabIndex = -1; g.slabel.tabIndex = g === fg ? -1 : 0; }); $('#back').tabIndex = 0;
}

// ---------- entrance ----------
function setCount(np, nl){ $('#nP').textContent = np; $('#nL').textContent = nl; }
function entrance(){
  if (INSTANT){ setCount(P.length, groups.length); return; }
  const lits = P.map(p => p._lit);
  gsap.set(lits, {autoAlpha: 0, scale: .6, transformOrigin: '50% 60%'});
  gsap.set(groups.map(g => g.label), {autoAlpha: 0, x: -8});
  gsap.set(['.top img', '.top h1', '.count'], {autoAlpha: 0, y: 8});
  setCount(0, 0);
  tl = gsap.timeline({defaults: {ease: 'power2.out'}, onComplete: () => {
    gsap.set(lits, {clearProps: 'transform,visibility,opacity'});
    gsap.set(groups.map(g => g.label), {clearProps: 'transform'});
  }});
  tl.to(['.top img', '.top h1', '.count'], {autoAlpha: 1, y: 0, duration: .32, stagger: .06}, 0);
  // counter runs in step with the rails: each rail's count lands while its cells land (driven by timeline time, so seeking works)
  const marks = []; let cum = 0;
  groups.forEach((g, i) => {
    const t0 = .1 + i * .12, n = g.items.length;
    const each = Math.min(.018, .42 / n);
    tl.to(g.label, {autoAlpha: 1, x: 0, duration: .28}, t0);

    marks.push({t: t0 + .05, d: Math.min(.3, n * each + .1), from: cum, n}); cum += n;

    const t = tl.time(); let np = 0, nl = 0;
    marks.forEach(m => { const k = Math.max(0, Math.min(1, (t - m.t) / m.d)); if (t >= m.t) nl++; np += Math.round(m.n * k); });

}

// ---------- rail focus (hand FLIP, transforms only) ----------
function snapshot(){ return new Map(P.map(p => [p, {x: p._x, y: p._y, s: p._s}])); }
function flipFrom(prev){
  const dur = D(.42);
  P.forEach(p => {
    const o = prev.get(p);
    gsap.killTweensOf(p._el);
    if (!dur || !o){ gsap.set(p._el, {x: 0, y: 0, scale: 1}); return; }
    gsap.fromTo(p._el, {x: o.x - p._x, y: o.y - p._y, scale: o.s / p._s},
      {x: 0, y: 0, scale: 1, duration: dur, ease: 'power3.inOut', clearProps: 'transform'});
  });
  const fade = [...groups.map(g => g.label), ...groups.map(g => g.rule), ...groups.map(g => g.slabel), $('#back'), $('#ftitle')];
  fade.forEach(el => { if (el.style.visibility === 'visible') gsap.fromTo(el, {opacity: 0}, {opacity: 1, duration: D(.3), delay: D(.18)}); });
}
function focusRail(g, push = true){

    if (g){ const y = g.prail.getBoundingClientRect().top + scrollY - 12; lenis ? lenis.scrollTo(y, {duration: D(.9) || 0, immediate: !animOn}) : scrollTo(0, y); }
    return;
  }
  if (g === focused) g = null;
  if (lifted) close(true);
  light(null);
  const prev = snapshot();
  focused = g;
  overviewOrFocus();
  flipFrom(prev);

  if (push) setHash(g ? 'rail=' + g.cat : '');

}

// ---------- hazard filter ----------
function resolveHazard(q){
  q = q.trim().toLowerCase();
  if (!q) return null;
  if (HAZ[q]) return {key:q, fn:HAZ[q]};
  if (ALIAS[q]) return {key:ALIAS[q], fn:HAZ[ALIAS[q]]};
  const pre = Object.keys(HAZ).find(k => k.startsWith(q) && q.length >= 3);
  if (pre) return {key:pre, fn:HAZ[pre]};
  return {key:q, fn: p => p._t.includes(q)};
}
function filter(q, push = true){
  const r = resolveHazard(q);

  document.querySelectorAll('.chip').forEach(c => { const on = c.dataset.h === activeH; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
  const on = [], off = []; let n = 0;
  P.forEach(p => { const m = !r || r.fn(p); p._match = m; (m ? on : off).push(p._lit); if (m) n++; });
  gsap.to(on, {opacity: 1, duration: D(.3), ease: 'power1.out', overwrite: 'auto'});
  if (off.length) gsap.to(off, {opacity: .22, duration: D(.3), ease: 'power1.out', overwrite: 'auto'});
  groups.forEach(g => {
    const k = g.items.filter(p => p._match).length;
    g.label.querySelector('.n').innerHTML = `<i>${g.key}</i>${esc(SHORT(g.cat))}<b>${r ? k : g.items.length}</b>${r && k < g.items.length ? `<span class="x"> / ${g.items.length}</span>` : ''}`;
  });
  $('#hzr').innerHTML = r ? `<b>${n}</b> of ${P.length} products answer “${esc(r.key)}”` : '';
  if (push) setHash(activeH ? 'hazard=' + activeH : '');
}

// ---------- spotlight (FLIP) ----------
const spot = $('#spot'), flyer = $('#flyer'), slot = $('#slot'), panel = $('#panel');
function aspect(p){ return p._img.naturalWidth ? p._img.naturalWidth / p._img.naturalHeight : 1; }
function visRect(p){   // the visible product inside its contain box (bottom-centred)
  const r = p._img.getBoundingClientRect(), a = aspect(p);
  let w = r.width, h = w / a; if (h > r.height){ h = r.height; w = h * a; }
  return {left: r.left + (r.width - w) / 2, top: r.top + r.height - h, width: w};
}
function targetRect(p){
  const r = slot.getBoundingClientRect(), a = aspect(p);
  const nat = p._img.naturalWidth ? {w: p._img.naturalWidth} : {w: 1e4};
  let w = r.width * .86, h = w / a;
  if (h > r.height * .9){ h = r.height * .9; w = h * a; }
  if (w > nat.w){ w = nat.w; h = w / a; }
  return {x: r.left + (r.width - w) / 2, y: r.top + (r.height - h) / 2, w, h};
}
function bullet(t){
  const i = t.indexOf(':');
  return i > 0 && i < 48 ? `<strong>${esc(t.slice(0,i))}:</strong>${esc(t.slice(i+1))}` : esc(t);
}
function fill(p){

  $('#info').innerHTML = `

    <h2>${esc(p.name)}</h2>

    ${rows.length ? `<dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>` : ''}
    ${(p.bullets||[]).length ? `<ul>${p.bullets.slice(0,5).map(b => `<li>${bullet(b)}</li>`).join('')}</ul>` : ''}
    <div class="acts"><button class="cta" id="cta">Add to quote</button>
    ${p.url ? `<a class="ext" href="${esc(p.url)}" target="_blank" rel="noopener">Open on aves-safety.com<svg viewBox="0 0 12 12" fill="none" stroke-width="1.4"><path d="M4 2h6v6M10 2L2 10"/></svg></a>` : ''}</div>

function open(p, push = true){

  lifted = p; light(null); fill(p);
  const from = visRect(p);
  flyer.src = p._img.src;
  gsap.set(spot, {autoAlpha: 1});
  const phone = mode === 'phone';
  if (phone) gsap.set(panel, {yPercent: 0});
  const to = targetRect(p);
  Object.assign(flyer.style, {width: to.w + 'px', height: to.h + 'px'});
  p._el.classList.add('lifted');
  lenis && lenis.stop();
  const dur = D(.42);
  gsap.fromTo(flyer, {autoAlpha: 1, x: from.left, y: from.top, scale: from.width / to.w},

  gsap.to('#side', {autoAlpha: 0, duration: dur && D(.2)});
  gsap.fromTo('#scrim', {opacity: 0}, {opacity: 1, duration: dur});
  gsap.fromTo('#glow', {opacity: 0, scale: .6}, {opacity: 1, scale: 1, duration: D(.5), ease: 'power2.out'});
  if (phone) gsap.fromTo(panel, {yPercent: 100}, {yPercent: 0, duration: dur, ease: 'power3.out'});

    lifted = q; fill(q);
    flyer.src = q._img.src;
    const to = targetRect(q);
    Object.assign(flyer.style, {width: to.w + 'px', height: to.h + 'px'});
    gsap.fromTo(flyer, {autoAlpha: 0, x: to.x + 28 * dir, y: to.y, scale: 1}, {autoAlpha: 1, x: to.x, duration: D(.24), ease: 'power2.out'});

// ---------- dark-product backing (luminance of opaque pixels, computed once) ----------
function lumPass(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 32;
  const cx = cv.getContext('2d', {willReadFrequently: true});
  const measure = p => {
    if (LUM.has(p.id)) return;
    cx.clearRect(0, 0, 32, 32); cx.drawImage(p._img, 0, 0, 32, 32);
    const d = cx.getImageData(0, 0, 32, 32).data; let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i+3] > 128){ s += (.2126*d[i] + .7152*d[i+1] + .0722*d[i+2]) / 255; n++; }
    const L = n ? s / n : 1; LUM.set(p.id, L);
    if (L < .18) p._el.classList.add('dark');
  };
  const idle = window.requestIdleCallback || (f => setTimeout(() => f({timeRemaining: () => 8}), 16));
  const queue = P.slice();
  const run = dl => {
    while (queue.length && dl.timeRemaining() > 2){
      const p = queue.shift();
      if (p._img.complete && p._img.naturalWidth) measure(p);
      else p._img.addEventListener('load', () => measure(p), {once: true});
    }
    if (queue.length) idle(run);
  };
  setTimeout(() => idle(run), INSTANT ? 0 : 1700);
}

// ---------- hash states ----------
function parseHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  const i = h.indexOf('=');
  return i < 0 ? {k: h.toLowerCase(), v: ''} : {k: h.slice(0, i).toLowerCase(), v: h.slice(i + 1)};
}
function findRail(v){
  v = v.trim().toLowerCase(); if (!v) return null;
  return groups.find(g => g.cat.toLowerCase() === v) || groups.find(g => g.cat.toLowerCase().startsWith(v)) || groups.find(g => g.key === v) || null;
}
let ownHash = false;
function setHash(h){
  ownHash = true;
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
  ownHash = false;
}
function applyHash(){
  const {k, v} = parseHash();
  const p = (k === 'lift' || k === 'hot') ? P.find(x => x.id === v) : null;
  if (k !== 'lift' && lifted) close(true);
  if (k !== 'hazard' && activeH){ $('#q').value = ''; filter('', false); }
  if (k === 'rail'){ const g = findRail(v); if (g && g !== focused) focusRail(g, false); }
  else if (focused && !(k === 'lift' && p && p._g === focused)) focusRail(focused, false);   // toggles back to the overview
  if (k === 'hazard'){ $('#q').value = v; filter(v, false); }
  if (k === 'hot' && p){ light(p); }
  if (k === 'lift' && p){ if (lifted && lifted !== p) close(true); open(p, false); }
  window.__wall.state = {k, v, focused: focused && focused.cat, lifted: lifted && lifted.id, hazard: activeH};
}

// ---------- wiring ----------
function wire(){
  if (!RM){
    lenis = new Lenis({lerp: .12});
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }
  const itemOf = el => { const b = el.closest && el.closest('.item'); return b ? P.find(p => p.id === b.dataset.id) : null; };
  wall.addEventListener('pointerover', e => { if (e.pointerType === 'mouse'){ const p = itemOf(e.target); if (p) light(p); } });
  wall.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') light(null); });
  wall.addEventListener('click', e => {
    const rl = e.target.closest('.rl, .sl');
    if (rl){ focusRail(groups.find(g => g.cat === rl.dataset.cat)); return; }
    if (e.target.closest('#back')){ focusRail(null); return; }
    const p = itemOf(e.target); if (!p) return;
    if (focused && p._g !== focused){ focusRail(p._g); return; }    // a strip cell swaps focus
    if (lastPointer !== 'mouse' && hot !== p && e.detail !== 0){ light(p); return; }   // touch: tap lights, second tap lifts
    open(p);
  });
  wall.addEventListener('focusin', e => { const p = itemOf(e.target); if (p && lastPointer === 'kbd') light(p); });
  addEventListener('pointerdown', e => lastPointer = e.pointerType, true);
  addEventListener('keydown', e => {
    if (e.key === 'Tab'){ lastPointer = 'kbd'; return; }
    const typing = document.activeElement && document.activeElement.id === 'q';
    if (e.key === 'Escape'){
      if (lifted) close(); else if (typing){ $('#q').blur(); } else if (focused) focusRail(null); else if (activeH){ $('#q').value = ''; filter(''); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (lifted){
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); }
      return;
    }
    const g = groups.find(x => x.key === e.key);
    if (g){ lastPointer = 'kbd'; focusRail(g); }
    else if (e.key === '0' && focused) focusRail(null);
  });
  $('#scrim').addEventListener('click', () => close());
  $('#close').addEventListener('click', () => close());
  let tm;
  $('#q').addEventListener('input', e => { clearTimeout(tm); tm = setTimeout(() => filter(e.target.value), 120); });
  $('#chips').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const v = activeH === c.dataset.h ? '' : c.dataset.h;
    $('#q').value = v; filter(v);
  });
  addEventListener('hashchange', () => { if (!ownHash){ animOn = !RM; applyHash(); } });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => {
    if (lifted) close(true);
    light(null); layout(); refreshSoon();
  }, 150); });
}

window.__wall = {get P(){ return P; }, get cell(){ return cellPx; }, get focusCell(){ return focusPx; }, LUM, tl: null,
  dark: () => P.filter(p => p._el.classList.contains('dark')).map(p => p.id)};
})();
</script>
